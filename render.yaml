# Render Blueprint: connect this repository in Render (New > Blueprint) to create
# the web service and its PostgreSQL database. Render asks for ADMIN_EMAIL and
# ADMIN_PASSWORD (the owner's first login). Customers create real accounts; the
# demo account switcher is off. Test payments are on and all catalog data and
# prices are synthetic: do not take real orders until a real payment provider
# and the factory's catalog are connected.
services:
  - type: web
    name: rta-cabinets
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_TEST_PAYMENTS
        value: "true"
      - key: MOCKPAY_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rta-cabinets-db
          property: connectionString

databases:
  - name: rta-cabinets-db
    plan: basic-256mb
    postgresMajorVersion: "16"
